name: Desktop release

# Builds the Windows installer and the Linux archive, runs each packaged app's --self-test, and on a v* tag publishes
# both (with .sha256 files) as a GitHub release. The README's download link and scripts/install.sh use these names.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            desktop/requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt -r desktop/requirements-build.txt
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/build_desktop.sh
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_desktop.ps1 -Version ("${{ github.ref_name }}" -replace '^v', '')
      - uses: actions/upload-artifact@v4
        with:
          name: hakiai-${{ runner.os }}
          path: dist/HakiAI-*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "HakiAI $TAG" --generate-notes
          gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --clobber

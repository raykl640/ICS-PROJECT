# Keyword router table (loaded by backend/app/retrieval/router.py).
# terms: lay-language words/phrases that suggest an Act. Matching is whole-word, case-insensitive, Porter-stemmed on both
#        sides, so "evict" also matches "evicted"/"eviction". Phrases match as contiguous words.
# aliases: explicit names for the Act beyond its full title and "Cap N" (both added from data/sources.yaml); any explicit
#          mention overrides keyword routing.
# Kiswahili entries are common everyday words used only as routing hints (unverified; see docs/HUMAN_TODO.md).
co_domain: constitution-of-kenya
# Rights topics (employment, labour, housing, police, fair trial, criminal offences, refugees): the Constitution is
# added after these Acts.
co_domain_for:
  - employment-act
  - landlord-and-tenant-shops-hotels-and-catering-establishments-act
  - rent-restriction-act
  - national-police-service-act
  - criminal-procedure-code
  - labour-relations-act
  - penal-code
  - refugees-act


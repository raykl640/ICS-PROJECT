# Scope examples (loaded by backend/app/retrieval/scope.py).
# A question counts as in scope when its MiniLM embedding sits closer to the in_scope examples than to the out_of_scope
# ones (mean of the top scope_neighbours cosine similarities, margin >= scope_margin in config.py).
# in_scope: everyday ways people describe situations the corpus Acts deal with, grouped by area. They are paraphrase
#           anchors, not legal statements: no statute text, section numbers or answers belong here.
# out_of_scope: topics with nothing to do with the corpus, including other countries' law. Kenyan legal topics the
#               corpus does not cover (tax, company registration) are deliberately in neither list:
#               they reach the model, which says when the retrieved text does not answer them.
# Not used by the tests (they use a synthetic table). Changing this file needs no index rebuild.
